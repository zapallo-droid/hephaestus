[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus_forge"
version = "0.1.0"
description = "ETL personal tracebility wrapper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesús Alcala" }]

dependencies = [
  "SQLAlchemy>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typing_extensions>=4.9",
  "greenlet>=3.0",
  "psycopg2-binary>=2.9"
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "ipython",
  "jupyter_client",
  "jupyter_core",
  "debugpy",
  "pyzmq",
  "Pygments",
  "nest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hephaestus_forge*"]

[tool.setuptools.package-data]
"hephaestus_forge" = ["**/*.sql", "**/*.yaml", "**/*.yml", "**/*.json"]



